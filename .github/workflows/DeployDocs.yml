#
# 构建 docs/ 里的 Docusaurus 站点，并发布到 GitHub Pages。
#
# 触发面：扩展分发流水线**跑完之后**（`Main Extension Distribution Pipeline`），或从 Actions 页手动
# 发起；普通提交不构建站点。也就是说文档站跟着**发版**走，一个 release 一次部署。
#
# `workflow_run` 跑在默认分支上，所以下面显式 checkout 那个 tag 的 SHA；deploy job 看到的 ref 因此是
# 分支 `main`。
#
# `github-pages` 环境是受保护的，允许部署的 ref 列在 Settings -> Environments -> github-pages ->
# Deployment branches and tags 里（需要分支 `main`；手动触发要用 tag 的话把 `v*.*.*` 也留着）。别的
# ref 会被拒绝并报
#   Tag "vX.Y.Z" is not allowed to deploy to github-pages due to environment protection rules.
# —— 下面的 deploy job 遇到这种情况会跳过，而不是失败。
#
# 一次性设置：仓库 Settings -> Pages -> Build and deployment -> Source 选 "GitHub Actions"。
#
# Builds the Docusaurus site in docs/ and publishes it to GitHub Pages. Triggered by the extension
# distribution pipeline finishing — so the site goes live with a release — or manually from the Actions
# tab. One-time setup: repository Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
#
name: Deploy Docs
on:
  workflow_run:
    workflows: ['Main Extension Distribution Pipeline']
    types: [completed]
  workflow_dispatch:

# Required by actions/deploy-pages: it exchanges the OIDC token for a Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two Pages deployments race; the later one wins.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    # PR 跑、以及手动跑流水线时也会触发 workflow_run；只有「成功 + 由推 v*.*.* tag 触发」才部署。
    #
    # A `workflow_run` also fires for pull-request runs and for manual runs of the pipeline; only a
    # successful run started by pushing a version tag deploys the site.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_run 默认 checkout 默认分支；站点要用流水线刚发布那个 tag 的代码。
          #
          # A `workflow_run` checks out the default branch by default; the site has to be built from
          # the tag whose release the pipeline just published.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      # Resolves the Pages base URL, honouring a custom domain when one is configured.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      # 类型检查会让文档里的 TS 与 TSX 一起过一遍（组件、配置、翻译键的用法），
      # 它抓到的是一类 `npm run build` 不会报的问题：类型不匹配、写错的 React 属性。
      # 不需要就删掉这一步。
      #
      # Type-checks the site's TS and TSX (components, config, translation usage). It catches a class
      # of problem `npm run build` does not report — type mismatches and mistyped React props. Drop
      # the step if you do not want it.
      - name: Typecheck
        working-directory: docs
        run: npm run typecheck

      - name: Build site
        working-directory: docs
        # A project site is served from /<repo>/, so Docusaurus is told the real url/baseUrl
        # instead of relying on the local-development fallbacks in docusaurus.config.ts.
        #
        # 站点不再从 release 取扩展产物（可运行 SQL 块连同 wasm 预加载一起退出了），所以这里既不需要
        # DOCS_EXTENSION_FROM_RELEASE，也不需要 GITHUB_TOKEN 去抬 release API 的速率限制。
        run: |
          set -euo pipefail
          # `base_url` is "https://<host>/<path>" and Docusaurus rejects it: `url` must be a bare
          # origin, the sub-path belongs in `baseUrl` ("" -> "/" when the site sits at the root).
          base_path='${{ steps.pages.outputs.base_path }}'
          export DOCS_URL='${{ steps.pages.outputs.origin }}'
          export DOCS_BASE_URL="${base_path%/}/"
          echo "Building for DOCS_URL=$DOCS_URL DOCS_BASE_URL=$DOCS_BASE_URL"
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/build

  # Deploys only from the refs whitelisted in the `github-pages` environment; anything else (say a
  # manual run started from a feature branch) stops after the build job above.
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref_type == 'tag' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
