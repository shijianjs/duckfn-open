[package]
name = "duckfn_open"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
# 这是 DuckDB 的 loadable extension（靠 GitHub Release 上的 .duckdb_extension 分发，
# 见根目录 AGENTS.md 的「发版流程」），不发 crates.io。
#
# A DuckDB loadable extension: it ships as the .duckdb_extension files attached to a GitHub Release
# (see the release flow in AGENTS.md) and is never published to crates.io.
publish = false

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
strip = true

[dependencies]
# duckfn：属性宏框架，把普通 Rust 函数变成 DuckDB 的标量 / 聚合 / 表函数等（见 src/extension/functions/）。
# 只挑实际用到的那个 feature（`cli`）。本模板用到 duckfn 的这两项：
#   - 属性宏生成的 `SQL_NAME` 常量：注册进 DuckDB 时真正的函数名（单签名时就是 Rust 函数名）。
#   - 属性宏上的 `description` / `comment` / `example`（`examples`）参数 + `cli` feature 里的
#     `cargo run --bin duckfn -- function_descriptions`：DuckDB 的 C 扩展 API 没有设置函数描述与示例的
#     接口，社区扩展文档页只能由导出的 `target/function_descriptions.csv` 覆盖，这里就是它的唯一来源
#     （见 src/bin/duckfn.rs 与 Justfile 的 `just docs_csv`）。`cli` 给 duckfn 带上 clap 与 csv。
#     不用 `just docs_csv` 的话可以删掉 src/bin/duckfn.rs（feature 留着也无妨）。
#
# 刻意不用 `all`：它顺带打开 `duckdb-1-5`（= quack-rs 的同一个开关），也就是 C API 的**不稳定区**
# （COPY 函数、宿主 VFS、标量 bind/init 那些槽位）。本模板只用稳定区 —— 关上它，产物才跨 DuckDB 发行版
# 可用（见 Makefile 里 `USE_UNSTABLE_C_API=0` 那段）。`chrono` / `uuid` / `rust_decimal` 的互转是 ABI
# 中立的，用到时再把对应 feature 打开、并把那个 crate 加成直接依赖（duckfn 不 re-export 它们）；
# `owned-connection`（0.0.15 起它才带来 `duck_vfs`）同样落在不稳定区那一档，本模板一样不需要。
#
# duckfn: the attribute-macro framework that turns ordinary Rust functions into DuckDB scalar /
# aggregate / table functions (see src/extension/functions/). Only the one feature actually used is on
# (`cli`). What this template uses from duckfn:
#   - the `SQL_NAME` constant each attribute macro generates: the name the function is really
#     registered under (the Rust function name, since each name carries one signature);
#   - the `description` / `comment` / `example` (`examples`) arguments of the attribute macros plus
#     `cargo run --bin duckfn -- function_descriptions` behind the `cli` feature: DuckDB's C extension
#     API cannot set a function's description or examples, so the community-extension doc page can only
#     be filled in from an exported `target/function_descriptions.csv` — this is its one source (see
#     src/bin/duckfn.rs and the `just docs_csv` recipe). `cli` pulls clap and csv into duckfn. Drop
#     src/bin/duckfn.rs if you never run `just docs_csv`.
#
# `all` is deliberately avoided: it also turns on `duckdb-1-5` (the same switch in quack-rs), i.e. the
# **unstable region** of the C API (copy functions, the host VFS, the scalar bind/init slots). This
# template stays inside the stable region, and turning that off is what makes the binary portable
# across DuckDB releases (see the `USE_UNSTABLE_C_API=0` note in the Makefile). The `chrono` / `uuid` /
# `rust_decimal` conversions are ABI-neutral: turn the matching feature on and add the crate as a
# direct dependency when you need one (duckfn re-exports none of them). `owned-connection` (which is
# what brings in `duck_vfs` since 0.0.15) sits in that unstable region too, so it is not needed here.
#
# 0.0.11 起 duckfn 的用户文档正文、示例扩展与 sqllogictest 范例也随这个 crate 发布：跑过一次构建之后
# 它们就在本机 cargo 的解包目录里（`<cargo>/registry/src/*/duckfn-<版本>/`），与这里钉的版本严格对应，
# 不需要 clone duckfn 的 git 仓库。路径与按主题的对照表见 AGENTS.md。
#
# Since 0.0.11 the crate package also carries duckfn's user-guide text, the example extension and its
# SQLLogicTest files: after any build they sit in cargo's unpacked source directory
# (`<cargo>/registry/src/*/duckfn-<version>/`), matching the version pinned here — no duckfn repository
# clone needed. AGENTS.md has the paths and a topic-by-topic map.
duckfn = { version = "0.1.0", features = ["cli"] }

# duckfn 本身就建立在下面两个 crate 之上；需要直接使用它们的类型或 builder 时显式加上。
# quack-rs：duckfn_entrypoint! 展开出的代码直接引用 `quack_rs::` 路径，必须显式依赖。
#
# duckfn is built on the two crates below; add them explicitly when you use their
# types or builders directly.
# quack-rs: the code expanded by `duckfn_entrypoint!` refers to `quack_rs::` paths,
# so it must be a direct dependency.
quack-rs = "0.18.0"

# loadable-extension：走 DuckDB 的 API 函数表分发，而不是链接 libduckdb，
# 这也是「无需在本地编译 DuckDB」的原因（仅使用头文件，不链接库）。
#
# 版本下限是 DuckDB 1.5：这是我们构建所依据的发行版，不再由 `duckdb-1-5` feature 决定 —— 那个已经关掉，
# 编出来的是纯稳定 C API 的产物。duckfn 与 quack-rs 自己的下限都是 `>=1.4.4, <2`，这里收得更紧是我们
# 自己的取舍：钉住依赖树里那份头文件是哪个版本。
# libduckdb-sys 把 DuckDB 版本编码成
# `1.<major*10000 + minor*100 + patch>.0`（1.5.0 → 1.10500.0，1.5.6 → 1.10506.0），
# 于是 `>=1.10500` 就是「DuckDB >= 1.5」。
#
# `loadable-extension` dispatches through DuckDB's API table instead of linking
# libduckdb — that is what keeps a local DuckDB build unnecessary (headers only).
#
# The lower bound is DuckDB 1.5: that is the release this build rests on, and it is no longer driven by
# the `duckdb-1-5` feature — that one is off, so what comes out is a pure stable C API binary. duckfn
# and quack-rs each carry a `>=1.4.4, <2` floor of their own; holding it tighter here is our own choice:
# it pins which headers the dependency tree uses.
# libduckdb-sys encodes a DuckDB version as
# `1.<major*10000 + minor*100 + patch>.0` (1.5.0 → 1.10500.0, 1.5.6 → 1.10506.0), so `>=1.10500`
# means "DuckDB >= 1.5".
libduckdb-sys = { version = ">=1.10500, <2", features = ["loadable-extension"] }

# 用到时间/日期（`DuckDate`、`DuckTimestamp*`…）或 UUID、DECIMAL 的互转时，打开 duckfn 的对应 feature
# （"chrono" / "uuid" / "rust_decimal"）并把那个 crate 加成直接依赖 —— duckfn 不 re-export 它们。例：
#   duckfn = { version = "0.1.0", features = ["cli", "chrono"] }
#   chrono = { version = "0.4", default-features = false, features = ["std"] }
#
# When you convert to those types, turn on duckfn's matching feature ("chrono" / "uuid" /
# "rust_decimal") and add the crate itself as a direct dependency — duckfn re-exports none of them.
# For example:
#   duckfn = { version = "0.1.0", features = ["cli", "chrono"] }
#   chrono = { version = "0.4", default-features = false, features = ["std"] }

# 这个扩展的全部能力都来自下面这一个 crate：它把「用桌面配置好的程序打开一个路径或 URL」这件事
# 做完了，本仓库只负责把它接到 SQL 上（见 src/extension/launcher.rs 与 functions/）。
#
# 这个扩展只构建桌面平台：启动器是桌面软件，所以没有 wasm 目标，open 也就是普通依赖而不是
# `[target.'cfg(…)'.dependencies]` 里的一项。
#
# Everything this extension wraps is the single crate below: it already knows how to open a path or URL
# with whatever the desktop is configured to use, and this repository only wires it up to SQL (see
# src/extension/launcher.rs and functions/).
#
# This extension builds for desktop targets only — a launcher is desktop software, so there is no wasm
# target and open is an ordinary dependency rather than a `[target.'cfg(…)'.dependencies]` entry.
# open：各平台入口（Windows 的 PowerShell 辅助进程与 explorer.exe 后备、macOS 的 /usr/bin/open、
# 类 Unix 的 xdg-open 及其后备序列、WSL 的 winebrowser）、参数引用、以及「启动器起不来」的错误，
# 都是它的事 —— 自己拼命令行既漏掉这些平台差异，又会踩引号的坑。
#
# `shellexecute-on-windows` 让 `_detached` 那组走 ShellExecuteW（一次原生 API 调用），而不是默认的
# 「spawn 出启动器进程再把它脱离」。`insecure` 那个 feature（Windows 上退回老的 `cmd /c start`）
# 恰恰是不该开的：它把路径当命令行片段拼，正是要躲开的注入面。
#
# open: it owns the per-platform entry points (the PowerShell helper with explorer.exe as fallback on
# Windows, /usr/bin/open on macOS, xdg-open and its fallback sequence on Unix, winebrowser under WSL),
# the argument quoting, and the error for "no launcher could be started". Building the command lines by
# hand would miss both the platform differences and the quoting pitfalls.
#
# `shellexecute-on-windows` makes the `_detached` group go through ShellExecuteW (one native API call)
# instead of the default "spawn the launcher, then detach it". The `insecure` feature (which restores
# the legacy `cmd /c start` on Windows) is exactly the one not to enable: it splices the path into a
# command line, which is the injection surface to avoid.
open = { version = "5.4", features = ["shellexecute-on-windows"] }

# 下面三个 crate 服务同一件事的另一半：把一段 SQL 里的**内容**（VARCHAR 或 BLOB）先落成一个文件，
# 因为启动器只认路径、不认内容（见 src/extension/writer.rs）。
#
# The three crates below serve the other half of the same story: turn a piece of **content** from SQL
# (VARCHAR or BLOB) into a file first, because a launcher understands paths and not content (see
# src/extension/writer.rs).

# sanitize-filename：文件名的**合法性**（非法字符 `/ \ ? < > : * | "`、控制字符、Windows 保留设备名
# `CON`/`NUL`/`COM1`…、结尾的点与空格）按 Node 同名库的规则由它维护，我们只说「替换成什么」。
# dir / name / part 三个用户可填的字段都要过它（见 writer.rs），一处规则、三处生效。
# 它自己的两个入口（改写 / 判断）也直接接到 SQL 上：op_filename 与 op_filename_check，
# 缺省跟库走，只有 windows 钉成 true（见 scalar_op_filename.rs）—— 那是给查询里的名字用的，不是落盘的助手。
#
# sanitize-filename: the **legality** of a file name (illegal characters `/ \ ? < > : * | "`, control
# characters, Windows reserved device names `CON`/`NUL`/`COM1`…, trailing dots and spaces) is
# maintained here, following the rules of the Node library of the same name; all we say is what to
# substitute. All three caller-supplied fields (dir / name / part) go through it (see writer.rs), so
# one set of rules covers them all. The crate's own two entry points (rewrite / test) are also wired
# straight into SQL as op_filename and op_filename_check, with the crate's defaults and only
# `windows` pinned to true (see scalar_op_filename.rs) — those serve names held by a query, they are
# not helpers of the write path.
sanitize-filename = "0.6"

# tempfile：**随机尾缀与撞名重试**，以及「这个文件名当时确实是空的」这个保证。自动命名（用户没给
# `name`）用它新建文件，而不是自己拼随机数再 `Path::exists` 轮询 —— 后者有 TOCTOU 的窗口，随机源也
# 要自己找。临时目录同样是它的事。
#
# tempfile: the **random suffix, the collision retry, and the guarantee that this name was empty at
# that moment**. Auto-naming (no `name` given) creates the file through it instead of rolling a random
# number and polling `Path::exists` — the latter leaves a TOCTOU window and needs its own random
# source. Finding the temporary directory is its business too.
tempfile = "3.27"

# chrono：自动名字里的时间戳（`%Y%m%d-%H%M%S`，放在最前，所以一个目录按名字排序就是按时间排序）。
# 不手算 epoch —— 日历算术正是它的事。`clock` 取本地时间，default features 已经带着它。
#
# chrono: the timestamp in an auto-generated name (`%Y%m%d-%H%M%S`, first, so sorting a directory by
# name sorts it by time). No hand-rolled epoch arithmetic — calendar arithmetic is exactly what it is
# for. `clock` gives the local time and the default features already carry it.
chrono = "0.4"
