extension:
  name: duckfn_open
  description: Open a local path or URL with the program your desktop is configured to use, straight from SQL
  version: 0.1.0
  language: Rust
  build: cargo
  license: MIT
  requires_toolchains: "rust;python3"
  maintainers:
    - shijianjs

repo:
  github: shijianjs/duckfn-open
  ref: <40-character commit SHA of the released version>

docs:
  hello_world: |
    -- What would open this on the machine running the query, without opening anything
    SELECT open_commands('report.html');

    -- Hand it to the default program; true once a launcher has been started
    SELECT open_path('./report.html');

    -- NULL input starts nothing, so SQL can tell "no input" from "could not open"
    SELECT open_path(NULL);
  extended_description: |
    `duckfn_open` wraps the Rust `open` crate for SQL: it hands a path or a URL to whatever the current
    desktop configuration opens that kind of thing with — the system default program, or one you name.
    Nothing is read, copied, or interpreted by DuckDB; the value goes to the platform launcher
    (ShellExecute on Windows, `/usr/bin/open` on macOS, `xdg-open` and its fallbacks on Unix).

    | Function | Input -> output | What it does |
    | --- | --- | --- |
    | `open_path(path)` | `VARCHAR` -> `BOOLEAN` | default program, waits for the launcher |
    | `open_path(path, app)` | `VARCHAR, VARCHAR` -> `BOOLEAN` | named program, waits for the launcher |
    | `open_path_detached(path)` | `VARCHAR` -> `BOOLEAN` | default program, returns as soon as it started |
    | `open_path_detached(path, app)` | `VARCHAR, VARCHAR` -> `BOOLEAN` | named program, same |
    | `open_commands(path)` | `VARCHAR` -> `VARCHAR[]` | lists the launcher commands, runs none |

    Three outcomes are distinguishable in SQL, and that is the whole contract: `NULL` means the row had
    no input (a NULL argument never reaches a launcher), `true` means a launcher was started, `false`
    means none could be started on this machine. Whether to wait is the visible difference between the
    two pairs — on Linux `xdg-open` returns only once the target program exits, so
    `open_path_detached` is what you want inside a query. An empty path or application is an error
    rather than a `false`, since a typo and an unopenable file deserve different answers.

    `open_commands` is the side-effect-free entry point: it lists, in the order the crate would try them,
    the launchers this machine would use, so "nothing opened" can be diagnosed without a desktop. Its result
    is the same on a headless CI runner as on a workstation, which is why it is also the example worth
    copying into a test.

    The extension touches no file system and no network of its own: it starts a process and nothing else,
    so it is worth a thought before calling it over a column of untrusted paths. Requires **DuckDB 1.3
    or newer**: it is built against DuckDB 1.5.6 headers but declares the C API floor it needs (v1.2.0),
    so one binary loads into 1.3.2 through 1.5.6 alike. Source and the development notes:
    <https://github.com/shijianjs/duckfn-open>.
