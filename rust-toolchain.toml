# 固定构建用的 Rust 工具链（下游依赖 duckfn 不继承本文件，它只作用于本仓库自己的构建）。
#
# 官方 ci-tools 的 v2.0-cyanoptera 已经把 Rust 钉在 1.97.1，这里写同一个版本，让本地构建与 CI 使用
# 同一个 rustc；扩展所需的 rustc 下限由其依赖决定（见 Cargo.toml 的 rust-version）。
#
# 本仓库的 CI 不构建 wasm（MainDistributionPipeline 用 exclude_archs 排掉了三个 wasm 平台），所以这里
# 没有 wasm target。哪天恢复 wasm，再把 target 加回来，并给 Makefile 的 link_wasm_* 补 -O0 覆盖。
#
# Pins the Rust used to build this repository (a downstream dependency on duckfn does not inherit it).
# ci-tools' v2.0-cyanoptera already pins 1.97.1; this file keeps local builds on the same rustc. This
# repository builds no wasm (exclude_archs drops the three wasm platforms), hence no wasm target.
[toolchain]
channel = "1.97.1"
